services:
  postgres:
    image: postgres:16-alpine
    container_name: aicrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicrp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicrp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aicrp_goat_breeding}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aicrp} -d ${POSTGRES_DB:-aicrp_goat_breeding}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
